# HTTPS static site: www.hideshadow.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hideshadow.com;

    ssl_certificate /etc/nginx/ssl/hideshadow_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/hideshadow_key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!SHA1;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Upload everything inside dist/ to this directory.
    root /var/www/hideshadow;
    index index.html;
    charset utf-8;

    # Missing static assets should return 404 instead of index.html.
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|otf|eot|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # During the temporary filing period, old Halo routes display the homepage.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Redirect the HTTPS apex domain to www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hideshadow.com;

    ssl_certificate /etc/nginx/ssl/hideshadow_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/hideshadow_key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!SHA1;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://www.hideshadow.com$request_uri;
}

# Redirect all HTTP traffic to the canonical HTTPS hostname.
server {
    listen 80;
    listen [::]:80;
    server_name hideshadow.com www.hideshadow.com;

    return 301 https://www.hideshadow.com$request_uri;
}
